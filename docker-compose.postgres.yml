# Alternativa com PostgreSQL, para quem precisar (política de TI, acesso ao
# banco por fora, mais de uma instância). O código é o mesmo: só muda a
# DATABASE_URL — nada no app depende de recurso exclusivo de um dos bancos.
#
#     docker compose -f docker-compose.postgres.yml up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: escala
      POSTGRES_PASSWORD: escala        # troque em produção
      POSTGRES_DB: escala
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escala"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://escala:escala@db:5432/escala
      # >= 32 bytes (HS256). Ver docker-compose.yml para como gerar.
      SECRET_KEY: ${SECRET_KEY:-troque-esta-chave-em-producao-por-uma-de-verdade}
    ports:
      - "8000:8000"

volumes:
  pgdata:
